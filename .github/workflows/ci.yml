name: Offline regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AHXC_AUTO_INSTALL_DEPS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Initialize example configuration
        run: Copy-Item config.example.json config.json
      - name: Offline unit tests
        run: python -m pytest tests/unit --ignore=tests/unit/akshare_test.py -q
      - name: Frontend contract tests
        run: node --test tests/frontend/test_price_readiness_ui.cjs tests/frontend/test_trading_scope_ui.cjs tests/frontend/test_settlement_report_ui.cjs tests/frontend/test_final_account_event.cjs
